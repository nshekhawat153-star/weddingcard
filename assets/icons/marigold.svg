<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Auspicious Indian Marigold Flower (Genda Phool) -->
  <defs>
    <radialGradient id="marigoldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="40%" stop-color="#FF9800"/>
      <stop offset="75%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </radialGradient>
  </defs>
  <g transform="translate(50,50)">
    <!-- Layer 1 Outer Frilly Petals -->
    <g fill="url(#marigoldGrad)">
      <circle cx="0" cy="-35" r="12"/>
      <circle cx="25" cy="-25" r="12"/>
      <circle cx="35" cy="0" r="12"/>
      <circle cx="25" cy="25" r="12"/>
      <circle cx="0" cy="35" r="12"/>
      <circle cx="-25" cy="25" r="12"/>
      <circle cx="-35" cy="0" r="12"/>
      <circle cx="-25" cy="-25" r="12"/>
    </g>
    <!-- Layer 2 Middle Ruffled Petals -->
    <g fill="#FFA000">
      <circle cx="0" cy="-24" r="10"/>
      <circle cx="17" cy="-17" r="10"/>
      <circle cx="24" cy="0" r="10"/>
      <circle cx="17" cy="17" r="10"/>
      <circle cx="0" cy="24" r="10"/>
      <circle cx="-17" cy="17" r="10"/>
      <circle cx="-24" cy="0" r="10"/>
      <circle cx="-17" cy="-17" r="10"/>
    </g>
    <!-- Layer 3 Inner Dense Petals -->
    <g fill="#FF6F00">
      <circle cx="0" cy="-14" r="7"/>
      <circle cx="10" cy="-10" r="7"/>
      <circle cx="14" cy="0" r="7"/>
      <circle cx="10" cy="10" r="7"/>
      <circle cx="0" cy="14" r="7"/>
      <circle cx="-10" cy="10" r="7"/>
      <circle cx="-14" cy="0" r="7"/>
      <circle cx="-10" cy="-10" r="7"/>
    </g>
    <!-- Core Center -->
    <circle cx="0" cy="0" r="8" fill="#E65100"/>
    <circle cx="0" cy="0" r="4" fill="#BF360C"/>
  </g>
</svg>
