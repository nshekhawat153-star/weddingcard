  <ellipse cx="24" cy="53" rx="2" ry="3.5" fill="#FFC107"/>
  <ellipse cx="50" cy="49" rx="2" ry="3.5" fill="#FFC107"/>
  <ellipse cx="76" cy="53" rx="2" ry="3.5" fill="#FFC107"/>
  <!-- Crystal Prisms Hanging Below -->
  <path d="M50 68 L53 78 L50 84 L47 78 Z" fill="url(#recGold)"/>
  <path d="M30 68 L33 76 L30 81 L27 76 Z" fill="url(#recGold)"/>
