<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Royal Chandelier / Grand Reception -->
  <defs>
    <linearGradient id="recGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>
  <!-- Ceiling Chain -->
  <line x1="50" y1="5" x2="50" y2="28" stroke="url(#recGold)" stroke-width="2"/>
  <circle cx="50" cy="28" r="4" fill="url(#recGold)"/>
  <!-- Tier 1 Crown -->
  <path d="M35 34 Q50 40 65 34" stroke="url(#recGold)" stroke-width="2" fill="none"/>
  <!-- Main Arms -->
  <path d="M50 40 C30 40 18 52 18 64 C26 64 34 56 50 56 C66 56 74 64 82 64 C82 52 70 40 50 40 Z" fill="url(#recGold)" opacity="0.85"/>
