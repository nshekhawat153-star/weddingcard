<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Royal Gold Mandala -->
  <defs>
    <linearGradient id="goldMandala" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>
  <g transform="translate(100,100)" stroke="url(#goldMandala)" stroke-width="1.2" stroke-linecap="round">
    <!-- Center concentric circles -->
    <circle cx="0" cy="0" r="8" fill="url(#goldMandala)" fill-opacity="0.2"/>
    <circle cx="0" cy="0" r="16"/>
    <circle cx="0" cy="0" r="28" stroke-dasharray="2 3"/>
    <circle cx="0" cy="0" r="42"/>
    <circle cx="0" cy="0" r="62" stroke-dasharray="3 4"/>
    <circle cx="0" cy="0" r="82"/>
    <circle cx="0" cy="0" r="92"/>

    <!-- 12 Petal Loop Outer -->
    <g id="petalGroup">
      <path d="M0 -42 C10 -55 10 -75 0 -82 C-10 -75 -10 -55 0 -42 Z"/>
      <circle cx="0" cy="-87" r="2" fill="url(#goldMandala)"/>
    </g>
    <use href="#petalGroup" transform="rotate(30)"/>
    <use href="#petalGroup" transform="rotate(60)"/>
    <use href="#petalGroup" transform="rotate(90)"/>
    <use href="#petalGroup" transform="rotate(120)"/>
    <use href="#petalGroup" transform="rotate(150)"/>
    <use href="#petalGroup" transform="rotate(180)"/>
    <use href="#petalGroup" transform="rotate(210)"/>
    <use href="#petalGroup" transform="rotate(240)"/>
    <use href="#petalGroup" transform="rotate(270)"/>
    <use href="#petalGroup" transform="rotate(300)"/>
    <use href="#petalGroup" transform="rotate(330)"/>

    <!-- Inner 8 Petal Flourish -->
    <g id="innerPetal">
      <path d="M0 -16 Q8 -24 0 -36 Q-8 -24 0 -16 Z" fill="url(#goldMandala)" fill-opacity="0.15"/>
    </g>
    <use href="#innerPetal" transform="rotate(45)"/>
    <use href="#innerPetal" transform="rotate(90)"/>
    <use href="#innerPetal" transform="rotate(135)"/>
    <use href="#innerPetal" transform="rotate(180)"/>
    <use href="#innerPetal" transform="rotate(225)"/>
    <use href="#innerPetal" transform="rotate(270)"/>
    <use href="#innerPetal" transform="rotate(315)"/>
  </g>
</svg>
