<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Sacred Vivah Havan Kund (Agni) -->
  <defs>
    <linearGradient id="kundGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D50000"/>
      <stop offset="40%" stop-color="#FF6D00"/>
      <stop offset="80%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <!-- Kund Tiers (Stepped Copper/Gold Kund) -->
  <!-- Bottom Tier -->
  <path d="M15 88 H85 L78 78 H22 Z" fill="url(#kundGold)"/>
  <!-- Middle Tier -->
  <path d="M22 78 H78 L72 68 H28 Z" fill="url(#kundGold)" opacity="0.9"/>
  <!-- Top Tier -->
  <path d="M28 68 H72 L66 58 H34 Z" fill="url(#kundGold)" opacity="0.8"/>
  <!-- Decorative Rim Engravings -->
  <line x1="16" y1="87" x2="84" y2="87" stroke="#3E2723" stroke-width="1.5"/>
  <line x1="23" y1="77" x2="77" y2="77" stroke="#3E2723" stroke-width="1.5"/>
  <!-- Sacred Fire Agni Flames -->
  <!-- Outer Flame -->
  <path d="M50 14 C40 32 32 44 38 58 C45 62 55 62 62 58 C68 44 60 32 50 14 Z" fill="url(#fireGrad)"/>
  <!-- Mid Flame -->
  <path d="M50 24 C44 36 38 46 43 56 C48 59 52 59 57 56 C62 46 56 36 50 24 Z" fill="#FFD600"/>
  <!-- Core Bright Flame -->
  <path d="M50 36 C47 43 45 49 48 55 C50 56 50 56 52 55 C55 49 53 43 50 36 Z" fill="#FFF9C4"/>
  <!-- Floating Sacred Sparks -->
  <circle cx="36" cy="28" r="1.5" fill="#FFD600"/>
  <circle cx="64" cy="24" r="1.5" fill="#FFAB00"/>
  <circle cx="48" cy="10" r="1.2" fill="#FF6D00"/>
</svg>
