<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Dholak / Musical Beats for Sangeet -->
  <defs>
    <linearGradient id="dholakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="50%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#2D1D18"/>
    </linearGradient>
    <linearGradient id="sangeetGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <!-- Barrel Body -->
  <ellipse cx="50" cy="50" rx="36" ry="24" fill="url(#dholakGrad)" stroke="url(#sangeetGold)" stroke-width="1.5"/>
  <!-- Left Membrane Head -->
