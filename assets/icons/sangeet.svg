  <!-- Rope / Lacing Zig-Zags -->
  <path d="M18 32 L50 26 L82 32 M18 68 L50 74 L82 68 M18 36 L50 72 L82 36 M18 64 L50 28 L82 64" stroke="url(#sangeetGold)" stroke-width="1.2" opacity="0.8"/>
  <!-- Musical Floating Sparkles -->
  <path d="M38 16 L40 22 L46 24 L40 26 L38 32 L36 26 L30 24 L36 22 Z" fill="url(#sangeetGold)"/>
  <path d="M72 12 L73 17 L78 18 L73 20 L72 25 L70 20 L65 18 L70 17 Z" fill="url(#sangeetGold)"/>
  <circle cx="88" cy="22" r="2" fill="url(#sangeetGold)"/>
